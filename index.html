<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08080c" />
<title>RYEDZ PROMPT VAULT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="glassmorphism.css" />
<style>
  .prompt-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); 
    gap: 20px; 
    margin-top: 24px; 
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar-wrapper">
  <header class="navbar-container">
    <a href="index.html" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l-8.5-4.25L12 11.5l8.5-4.75L12 11z"/></svg>
      </div>
      <span>RYEDZ VAULT</span>
    </a>
    
    <div class="nav-actions">
      <!-- Muncul kalau BELUM login -->
      <div id="btn-login-area">
        <a href="login.html" class="btn btn-primary">Login / Register</a>
      </div>
      <!-- Muncul kalau UDAH login -->
      <div id="btn-dashboard-area" style="display:none;">
        <a href="#" id="btn-goto-dashboard" class="btn btn-secondary">Dashboard</a>
      </div>
    </div>
  </header>
</div>

<!-- HERO SECTION -->
<section class="hero-section" style="text-align: center; padding-top: 120px;">
  <h1 class="hero-title" id="hero-title">EXPLORE AI PROMPTS</h1>
  <p class="hero-description" id="hero-desc">Temukan prompt AI berkualitas tinggi untuk membantu pekerjaan dan kreativitasmu.</p>
</section>

<!-- PROMPT GRID -->
<section class="container" style="padding-bottom: 60px;">
  <div id="prompt-list" class="prompt-grid">
    <!-- Loading Skeleton -->
    <div class="glass-card" style="padding:20px;"><div class="skeleton" style="height:150px; margin-bottom:12px;"></div><div class="skeleton" style="height:20px; width:70%;"></div></div>
    <div class="glass-card" style="padding:20px;"><div class="skeleton" style="height:150px; margin-bottom:12px;"></div><div class="skeleton" style="height:20px; width:70%;"></div></div>
    <div class="glass-card" style="padding:20px;"><div class="skeleton" style="height:150px; margin-bottom:12px;"></div><div class="skeleton" style="height:20px; width:70%;"></div></div>
  </div>
</section>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

<!-- CORE & CONFIG -->
<script src="firebase-config.js"></script>
<script src="firebase-init.js"></script>
<script src="ryedz-core.js"></script>

<script>
  'use strict';

  // 1. CEK STATUS LOGIN (Untuk Tombol Dashboard)
  RyedzFB.onAuthChange((user, profile) => {
    if (user) {
      document.getElementById('btn-login-area').style.display = 'none';
      document.getElementById('btn-dashboard-area').style.display = 'block';
      
      let role = profile.role || 'user';
      // Arahkan ke halaman yang tepat
      let dashUrl = role === 'developer' ? 'develover.html' : 'user.html';
      document.getElementById('btn-goto-dashboard').href = dashUrl;
    } else {
      document.getElementById('btn-login-area').style.display = 'block';
      document.getElementById('btn-dashboard-area').style.display = 'none';
    }
  });

  // 2. AMBIL DATA PROMPT DARI FIREBASE (REAL-TIME)
  RyedzFB.listenPublishedPrompts((prompts) => {
    const list = document.getElementById('prompt-list');
    
    // Kalau kosong
    if (prompts.length === 0) {
      list.innerHTML = `
        <div class="glass" style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">
          <div style="font-size:2rem; margin-bottom:12px;">📭</div>
          <h3 style="color:#fff; margin-bottom:8px;">Belum Ada Prompt</h3>
          <p>Jadilah yang pertama untuk mengupload prompt!</p>
        </div>
      `;
      return;
    }

    // Render kartu prompt
    list.innerHTML = prompts.map(p => `
      <div class="glass-card" style="border-radius:16px; overflow:hidden; display:flex; flex-direction:column;">
        <!-- Thumbnail SVG Deterministik -->
        <img src="${Ryedz.generateThumbnail(p.id, p.title, p.aiModel)}" style="width:100%; display:block;" alt="${Ryedz.escapeXml(p.title)}">
        
        <div style="padding: 16px; flex:1; display:flex; flex-direction:column;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="badge badge-blue">${Ryedz.escapeXml(p.aiModel || 'ChatGPT')}</span>
            <span class="badge badge-purple">${Ryedz.escapeXml(p.category || 'General')}</span>
          </div>
          
          <h3 style="margin-bottom:8px; color:#fff; font-size:1.1rem; font-weight:700;">${Ryedz.escapeXml(p.title)}</h3>
          
          <p style="color:#94a3b8; font-size:0.85rem; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:16px; flex:1;">
            ${Ryedz.escapeXml(p.content)}
          </p>
          
          <div style="font-size:0.75rem; color:#64748b; border-top:1px solid rgba(255,255,255,0.05); padding-top:12px;">
            By ${Ryedz.escapeXml((p.ownerEmail || 'creator').split('@')[0])}
          </div>
        </div>
      </div>
    `).join('');
  });
</script>
</body>
</html>
