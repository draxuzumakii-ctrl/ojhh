<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prompt Vault — RYEDZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="glassmorphism.css" />
<style>
  .prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; margin-top: 24px; }
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar-wrapper">
  <header class="navbar-container">
    <a href="index.html" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l-8.5-4.25L12 11.5l8.5-4.75L12 11z"/></svg>
      </div>
      <span>RYEDZ VAULT</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-secondary btn-sm">← Home</a>
      <a href="login.html" class="btn btn-primary btn-sm">Login to Upload</a>
    </div>
  </header>
</div>

<!-- HEADER -->
<section class="container" style="text-align: center; padding-top: 120px; padding-bottom: 20px;">
  <h1 style="font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 12px;">THE PROMPT VAULT</h1>
  <p style="color: #94a3b8; font-size: 1.05rem;">Koleksi prompt AI terbaik dari komunitas.</p>
</section>

<!-- PROMPT GRID -->
<section class="container" style="padding-bottom: 60px;">
  <div id="prompt-list" class="prompt-grid">
    <!-- Skeleton Loader -->
    <div class="glass-card" style="padding:20px;"><div class="skeleton" style="height:150px; margin-bottom:12px;"></div><div class="skeleton" style="height:20px; width:70%;"></div></div>
    <div class="glass-card" style="padding:20px;"><div class="skeleton" style="height:150px; margin-bottom:12px;"></div><div class="skeleton" style="height:20px; width:70%;"></div></div>
    <div class="glass-card" style="padding:20px;"><div class="skeleton" style="height:150px; margin-bottom:12px;"></div><div class="skeleton" style="height:20px; width:70%;"></div></div>
  </div>
</section>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-init.js"></script>
<script src="ryedz-core.js"></script>
<script>
  // Ambil data dari Firebase
  RyedzFB.listenPublishedPrompts((prompts) => {
    const list = document.getElementById('prompt-list');
    
    if (prompts.length === 0) {
      list.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">Belum ada prompt yang dipublish.</div>`;
      return;
    }

    list.innerHTML = prompts.map(p => `
      <div class="glass-card" style="border-radius:16px; overflow:hidden;">
        <img src="${Ryedz.generateThumbnail(p.id, p.title, p.aiModel)}" style="width:100%; display:block;">
        <div style="padding: 16px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span class="badge badge-blue">${Ryedz.escapeXml(p.aiModel)}</span>
            <span class="badge badge-purple">${Ryedz.escapeXml(p.category || 'General')}</span>
          </div>
          <h3 style="margin-bottom:8px; color:#fff; font-size:1.1rem;">${Ryedz.escapeXml(p.title)}</h3>
          <p style="color:#94a3b8; font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${Ryedz.escapeXml(p.content)}</p>
          <div style="font-size:0.75rem; color:#64748b; margin-top:16px; border-top:1px solid #333; padding-top:12px;">
            By ${Ryedz.escapeXml((p.ownerEmail || 'creator').split('@')[0])}
          </div>
        </div>
      </div>
    `).join('');
  });
</script>
</body>
</html>
